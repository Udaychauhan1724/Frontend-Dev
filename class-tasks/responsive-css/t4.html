  <!-- Create a simple heading and paragraph with responsive font sizes.
Use either:
Relative units (em, rem, %),
or the clamp() function → font-size: clamp(1rem, 2vw, 2rem); -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Typography</title>
  <style>
    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
    }
    p {
      font-size: clamp(1rem, 4vw, 2rem);
    }
  </style>
</head>
<body>
  <h1>Responsive Heading</h1>
  <p>Responsive text.</p>
</body>
</html>
