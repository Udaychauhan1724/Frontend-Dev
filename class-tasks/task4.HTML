<!-- Demonstrate selectors: element, class, ID, attribute, combinators (>, +, ~, descendant).
Use real tags (p, ul, a, etc.) + CSS comments to explain.
Structured with heading and footer. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Demonstration</title>
  <style>
    /* Element Selector */
    p {
      color: blue;
    }
    /* Class Selector */
    .highlight {
      background-color: yellow;
    }
    /* ID Selector */
    #unique {
      font-weight: bold;
    }
    /* Attribute Selector */
    a[target="_blank"] {
      color: red;
    }
    /* Child Combinator */
    ul > li {
      list-style-type: square;
    }
    /* Adjacent Sibling Combinator */
    h1 + p {
      font-style: italic;
    }
    /* General Sibling Combinator */
    h1 ~ p {
      color: green;
    }
    /* Descendant Combinator */
    div p {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSS Selectors Demonstration</h1>
  </header>
  <main>
    <p>This is a paragraph.</p>
    <p class="highlight">This paragraph is highlighted.</p>
    <p id="unique">This paragraph has a unique ID.</p>
    <ul>
      <li>List item 1</li>
      <li>List item 2</li>
    </ul>
    <a href="#" target="_blank">This link opens in a new tab.</a>
  </main>
  <footer>
    <p>Footer content goes here.</p>
  </footer>
</body>
</html>
